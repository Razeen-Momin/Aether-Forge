<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER FORGE | Forgot password</title>
    <script src="theme.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      .auth-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
      }
      .auth-top .logo-img {
        height: 56px;
        width: auto;
        display: block;
      }
      .auth-main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px 48px;
      }
      .auth-container {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow:
          0 1px 2px var(--shadow),
          0 16px 40px var(--shadow);
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .input-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        outline: none;
        font-size: 1rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
      }
      .btn-auth {
        width: 100%;
        padding: 13px;
        margin-top: 4px;
        background: var(--accent);
        border: 1px solid var(--accent);
        color: var(--on-accent);
        font-size: 1rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition:
          filter 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn-auth:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.25);
      }
      .toggle-text {
        margin-top: 22px;
        font-size: 0.9rem;
        color: var(--muted);
        display: block;
        text-decoration: none;
        text-align: center;
        transition: color 0.2s;
      }
      .toggle-text:hover {
        color: var(--accent);
      }
      #status-message {
        margin-top: 16px;
        font-size: 0.9rem;
        text-align: center;
        min-height: 20px;
      }
      #status-message.info {
        color: var(--muted);
      }
      #status-message.ok {
        color: var(--accent);
      }
      #status-message.err {
        color: var(--danger);
      }
      .google-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0 18px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .google-divider::before,
      .google-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .google-button-wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .hint {
        margin: 18px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }
      .btn-auth:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="auth-top">
      <a href="index.html" class="logo-block">
        <img src="logo.png" alt="Aether Forge" class="logo-img" />
      </a>
      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
      >
        ☀️
      </button>
    </header>
    <main class="auth-main">
      <div class="auth-container">
        <h2>Reset your password</h2>
        <p class="subtitle">
          Enter the email linked to your account and we'll send you a reset
          link.
        </p>
        <form id="forgot-form">
          <div class="input-group">
            <label for="email">Email address</label>
            <input type="email" id="email" required autocomplete="email" />
          </div>
          <button type="submit" class="btn-auth" id="submit-btn">
            Send reset link
          </button>
        </form>

        <div id="status-message" class="info" role="status"></div>

        <p class="hint">
          Password reset works for accounts that have a verified email address.
        </p>

        <a href="login.html" class="toggle-text">Back to sign in</a>
      </div>
    </main>

    <script>
      const form = document.getElementById("forgot-form");
      const statusMessage = document.getElementById("status-message");
      const submitBtn = document.getElementById("submit-btn");

      function setStatus(kind, text) {
        statusMessage.className = kind;
        statusMessage.innerText = text;
      }

      // Stops repeated clicking: the button waits 60 seconds after a send
      function startCooldown(seconds) {
        let left = seconds;
        submitBtn.disabled = true;
        const timer = setInterval(() => {
          left -= 1;
          if (left <= 0) {
            clearInterval(timer);
            submitBtn.disabled = false;
            submitBtn.innerText = "Send reset link";
          } else {
            submitBtn.innerText = "Send again in " + left + "s";
          }
        }, 1000);
        submitBtn.innerText = "Send again in " + left + "s";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();

        submitBtn.disabled = true;
        setStatus("info", "Sending...");

        try {
          const response = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await response.json();

          if (response.ok) {
            setStatus("ok", data.message);
            startCooldown(60);
          } else {
            setStatus("err", data.message || "Something went wrong.");
            submitBtn.disabled = false;
          }
        } catch (error) {
          setStatus("err", "Network error: server unreachable.");
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>

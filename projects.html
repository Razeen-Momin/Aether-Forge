<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AETHER FORGE | Projects</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #020202;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            perspective: 1200px;
        }


        /* =========================================
           3D MOVING GRID
        ========================================= */

        .grid-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            perspective: 600px;
            z-index: -2;
            overflow: hidden;
        }

        .moving-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            left: -50%;
            top: -50%;

            background-image:
                linear-gradient(
                    rgba(0, 255, 255, 0.1) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 255, 255, 0.1) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            transform: rotateX(60deg) translateY(0);

            animation:
                gridFlow 10s linear infinite;
        }

        @keyframes gridFlow {

            100% {
                transform:
                    rotateX(60deg) translateY(100px);
            }

        }


        /* =========================================
           GLOW
        ========================================= */

        .glow-orb {
            position: fixed;

            top: 30%;
            left: 50%;

            width: 60vw;
            height: 60vw;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 200, 255, 0.15) 0%,
                    transparent 60%
                );

            transform:
                translate(-50%, -50%);

            z-index: -1;

            animation:
                pulse 4s infinite alternate;
        }

        @keyframes pulse {

            100% {
                opacity: 0.5;

                transform:
                    translate(-50%, -50%) scale(1.1);
            }

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        nav {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 20px 50px;

            background:
                rgba(0, 5, 10, 0.6);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(0, 255, 255, 0.2);

            position: relative;

            z-index: 100;
        }

        .logo-block {
            display: flex;

            align-items: center;

            gap: 15px;

            text-decoration: none;

            cursor: pointer;
        }

        .logo-img {
            height: 80px;
            width: auto;

            opacity: 0.85;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(0, 255, 255, 0.4)
                );

            transition:
                transform 0.3s ease,
                opacity 0.3s,
                filter 0.3s;
        }

        .logo-block:hover .logo-img {
            transform: scale(1.05);

            opacity: 1;

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(0, 255, 255, 0.7)
                );
        }

        .nav-links {
            display: flex;

            gap: 30px;

            align-items: center;
        }

        .nav-link {
            color: #88ccdd;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 2px;

            text-transform: uppercase;

            transition:
                color 0.3s,
                text-shadow 0.3s;

            position: relative;

            padding-bottom: 5px;
        }

        .nav-link:hover,
        .nav-link.active {

            color: #00ffff;

            text-shadow:
                0 0 10px
                rgba(0, 255, 255, 0.6);
        }

        .nav-link::after {
            content: '';

            position: absolute;

            bottom: 0;
            left: 0;

            width: 0%;
            height: 2px;

            background: #00ffff;

            box-shadow:
                0 0 10px #00ffff;

            transition:
                width 0.3s ease;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }


        /* =========================================
           AUTH
        ========================================= */

        #auth-section {
            display: flex;

            gap: 15px;

            align-items: center;
        }

        .btn-nav-login,
        .btn-nav-register,
        .btn-nav-logout {

            padding: 8px 20px;

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            border-radius: 4px;

            transition: 0.4s;
        }

        .btn-nav-login {

            background:
                rgba(0, 255, 255, 0.05);

            border:
                1px solid #00ffff;

            color: #00ffff;

            text-decoration: none;
        }

        .btn-nav-register {

            background:
                rgba(0, 255, 255, 0.1);

            border:
                1px solid #00ffff;

            color: #00ffff;

            text-decoration: none;
        }

        .btn-nav-login:hover,
        .btn-nav-register:hover {

            background: #00ffff;

            color: #000;

            box-shadow:
                0 0 20px
                rgba(0, 255, 255, 0.6);

            transform:
                translateY(-2px);
        }

        .btn-nav-logout {

            background:
                rgba(255, 51, 51, 0.1);

            border:
                1px solid #ff3333;

            color: #ff3333;

            cursor: pointer;
        }

        .btn-nav-logout:hover {

            background: #ff3333;

            color: #fff;

            box-shadow:
                0 0 20px
                rgba(255, 51, 51, 0.6);

            transform:
                translateY(-2px);
        }

        .operative-badge {

            color: #fff;

            font-size: 12px;

            letter-spacing: 2px;

            background:
                rgba(0, 255, 255, 0.1);

            padding: 8px 20px;

            border-radius: 4px;

            border:
                1px solid rgba(0, 255, 255, 0.3);
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {

            text-align: center;

            padding:
                80px 20px 45px;

            position: relative;

            z-index: 10;
        }

        .page-header h1 {

            font-size: 3.5rem;

            letter-spacing: 10px;

            text-transform: uppercase;

            color: #fff;

            margin-bottom: 15px;

            text-shadow:
                0 0 30px
                rgba(0, 255, 255, 0.35);
        }

        .page-header h1 span {

            color: #00ffff;
        }

        .page-header p {

            color: #88ccdd;

            font-size: 1rem;

            letter-spacing: 2px;

            line-height: 1.7;
        }


        /* =========================================
           PROJECT DASHBOARD
        ========================================= */

        #projects-section {

            position: relative;

            z-index: 20;

            width: 90%;

            max-width: 1200px;

            margin:
                20px auto 100px;

            padding: 35px;

            background:
                rgba(0, 10, 20, 0.72);

            border:
                1px solid rgba(0, 255, 255, 0.2);

            border-radius: 16px;

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.5);
        }


        /* =========================================
           PROJECT HEADER
        ========================================= */

        .projects-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;

            padding-bottom: 20px;

            border-bottom:
                1px solid
                rgba(0, 255, 255, 0.15);
        }

        .projects-title {

            color: #00ffff;

            font-size: 22px;

            letter-spacing: 4px;

            text-transform:
                uppercase;

            text-shadow:
                0 0 10px
                rgba(0, 255, 255, 0.4);
        }

        .project-count {

            color: #88ccdd;

            font-size: 11px;

            letter-spacing: 2px;

            margin-top: 7px;
        }


        /* =========================================
           CREATE BUTTON
        ========================================= */

        .create-project-btn {

            background:
                rgba(0, 255, 255, 0.08);

            border:
                1px solid #00ffff;

            color: #ffffff;

            padding:
                10px 18px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform:
                uppercase;

            transition: 0.3s;
        }

        .create-project-btn:hover {

            background: #00ffff;

            color: #000;

            box-shadow:
                0 0 20px
                rgba(0, 255, 255, 0.5);
        }


        /* =========================================
           PROJECT GRID
        ========================================= */

        #projects-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 22px;
        }


        /* =========================================
           PROJECT CARD
        ========================================= */

        .project-card {

            background:
                rgba(0, 20, 30, 0.65);

            border:
                1px solid
                rgba(0, 255, 255, 0.18);

            border-radius: 10px;

            padding: 22px;

            transition:
                transform 0.3s,
                border-color 0.3s,
                box-shadow 0.3s;

            position: relative;

            overflow: hidden;
        }

        .project-card::before {

            content: '';

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00ffff,
                    transparent
                );

            opacity: 0.5;
        }

        .project-card:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(0, 255, 255, 0.7);

            box-shadow:
                0 15px 35px
                rgba(0, 255, 255, 0.12);
        }


        /* =========================================
           PROJECT ICON
        ========================================= */

        .project-icon {

            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(0, 255, 255, 0.3);

            border-radius: 8px;

            color: #00ffff;

            font-size: 20px;

            margin-bottom: 15px;

            background:
                rgba(0, 255, 255, 0.05);
        }

        .project-name {

            color: #fff;

            font-size: 18px;

            letter-spacing: 1px;

            margin-bottom: 8px;

            word-break:
                break-word;
        }

        .project-description {

            color: #88ccdd;

            font-size: 12px;

            line-height: 1.5;

            min-height: 35px;

            margin-bottom: 15px;
        }

        .project-date {

            color: #557f88;

            font-size: 10px;

            letter-spacing: 1px;

            margin-bottom: 18px;
        }


        /* =========================================
           PROJECT ACTIONS
        ========================================= */

        .project-actions {

            display: flex;

            gap: 8px;
        }

        .project-btn {

            flex: 1;

            padding:
                9px 5px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 10px;

            letter-spacing: 1px;

            text-transform:
                uppercase;

            transition: 0.3s;
        }

        .open-project {

            background:
                rgba(0, 255, 255, 0.08);

            border:
                1px solid #00ffff;

            color: #ffffff;
        }

        .open-project:hover {

            background: #00ffff;

            color: #000;
        }

        .rename-project {

            background:
                rgba(255, 255, 255, 0.04);

            border:
                1px solid #557f88;

            color: #ffffff;
        }

        .rename-project:hover {

            border-color: #fff;

            color: #fff;
        }

        .delete-project {

            background:
                rgba(255, 51, 51, 0.05);

            border:
                1px solid #ff3333;

            color: #ff5555;
        }

        .delete-project:hover {

            background: #ff3333;

            color: #fff;
        }


        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty-projects {

            text-align: center;

            padding:
                70px 20px;

            color: #88ccdd;
        }

        .empty-projects-icon {

            font-size: 45px;

            margin-bottom: 20px;

            opacity: 0.6;
        }

        .empty-projects h3 {

            color: #00ffff;

            letter-spacing: 3px;

            margin-bottom: 10px;

            font-size: 18px;
        }

        .empty-projects p {

            font-size: 12px;

            letter-spacing: 1px;

            margin-bottom: 25px;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading-projects {

            text-align: center;

            padding: 60px;

            color: #00ffff;

            letter-spacing: 3px;

            font-size: 12px;

            animation:
                loadingPulse 1.5s infinite alternate;
        }

        @keyframes loadingPulse {

            from {
                opacity: 0.35;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            nav {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }

            .logo-block {

                flex-direction: column;

                gap: 5px;
            }

            .logo-img {

                height: 60px;
            }

            .nav-links {

                gap: 15px;

                flex-wrap: wrap;

                justify-content: center;

                margin-top: 10px;

                margin-bottom: 10px;
            }

            .nav-link {

                font-size: 12px;
            }

            #auth-section {

                flex-wrap: wrap;

                justify-content: center;
            }

            .page-header {

                padding:
                    60px 20px 35px;
            }

            .page-header h1 {

                font-size: 2.5rem;

                letter-spacing: 5px;
            }

            .page-header p {

                font-size: 0.85rem;
            }

            #projects-section {

                width: 94%;

                padding: 20px;

                margin-bottom: 60px;
            }

            .projects-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .projects-header
            .create-project-btn {

                width: 100%;
            }

            #projects-grid {

                grid-template-columns: 1fr;
            }

            .project-actions {

                flex-wrap: wrap;
            }

            .project-btn {

                min-width: 30%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================= -->

    <div class="grid-container">

        <div class="moving-grid"></div>

    </div>

    <div class="glow-orb"></div>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav>

        <a href="index.html"
           class="logo-block">

            <img
                src="logo.png"
                alt="Aether Forge"
                class="logo-img">

        </a>


        <div class="nav-links">

            <a
                href="index.html"
                class="nav-link">

                Home

            </a>

            <a
                href="projects.html"
                class="nav-link active">

                Projects

            </a>

            <a
                href="index.html#features"
                class="nav-link">

                Features

            </a>

            <a
                href="index.html#community"
                class="nav-link">

                Community

            </a>

            <a
                href="contact.html"
                class="nav-link">

                Contact

            </a>

        </div>


        <div id="auth-section"></div>

    </nav>


    <!-- =========================================
         PAGE HEADER
    ========================================= -->

    <section class="page-header">

        <h1>
            MY <span>PROJECTS</span>
        </h1>

        <p>
            Manage your construction projects,
            open existing designs, and initialize
            new creations.
        </p>

    </section>


    <!-- =========================================
         PROJECT DASHBOARD
    ========================================= -->

    <section id="projects-section">

        <div class="projects-header">

            <div>

                <div class="projects-title">

                    PROJECT ARCHIVE

                </div>

                <div
                    class="project-count"
                    id="project-count">

                    LOADING PROJECTS...

                </div>

            </div>


            <button
                class="create-project-btn"
                id="create-project-btn">

                + NEW PROJECT

            </button>

        </div>


        <div id="projects-grid">

            <div class="loading-projects">

                LOADING PROJECT DATABASE...

            </div>

        </div>

    </section>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async () => {


                /* =====================================
                   ELEMENTS
                ===================================== */

                const authSection =
                    document.getElementById(
                        'auth-section'
                    );

                const projectsGrid =
                    document.getElementById(
                        'projects-grid'
                    );

                const projectCount =
                    document.getElementById(
                        'project-count'
                    );

                const createProjectBtn =
                    document.getElementById(
                        'create-project-btn'
                    );


                let projects = [];


                /* =====================================
                   HTML ESCAPE
                ===================================== */

                function escapeHtml(value) {

                    const div =
                        document.createElement(
                            'div'
                        );

                    div.textContent =
                        value || '';

                    return div.innerHTML;

                }


                /* =====================================
                   FORMAT DATE
                ===================================== */

                function formatDate(dateString) {

                    if (!dateString) {

                        return "UNKNOWN";

                    }

                    const date =
                        new Date(dateString);

                    if (
                        Number.isNaN(
                            date.getTime()
                        )
                    ) {

                        return "UNKNOWN";

                    }

                    return date.toLocaleString(
                        [],
                        {
                            dateStyle: 'medium',
                            timeStyle: 'short'
                        }
                    );

                }


                /* =====================================
                   OPEN PROJECT
                ===================================== */

                function openProject(projectId) {

                    window.location.href =
                        `AetherForge.html?project_id=${projectId}`;

                }


                /* =====================================
                   CREATE PROJECT
                ===================================== */

                async function createProject() {

                    const projectName =
                        prompt(
                            "ENTER NEW PROJECT NAME:"
                        );

                    if (
                        !projectName ||
                        !projectName.trim()
                    ) {

                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                '/api/projects',
                                {
                                    method: 'POST',

                                    credentials:
                                        'include',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify({

                                            name:
                                                projectName.trim(),

                                            description:
                                                "Aether Forge Constructor Project"

                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                "PROJECT CREATION FAILED: " +
                                (
                                    data.message ||
                                    "Unknown error."
                                )
                            );

                            return;

                        }


                        await loadProjects();


                        if (
                            data.project &&
                            data.project.id
                        ) {

                            window.location.href =
                                `AetherForge.html?project_id=${data.project.id}`;

                        }

                    }

                    catch (error) {

                        console.error(
                            "Project creation error:",
                            error
                        );

                        alert(
                            "PROJECT SYSTEM OFFLINE."
                        );

                    }

                }


                /* =====================================
                   DELETE PROJECT
                ===================================== */

                async function deleteProject(
                    projectId,
                    projectName
                ) {

                    const confirmed =
                        confirm(
                            `DELETE PROJECT "${projectName}"?\n\nThis action cannot be undone.`
                        );

                    if (!confirmed) {

                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                `/api/projects/${projectId}`,
                                {
                                    method: 'DELETE',

                                    credentials:
                                        'include'
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                "DELETE FAILED: " +
                                (
                                    data.message ||
                                    "Unknown error."
                                )
                            );

                            return;

                        }


                        await loadProjects();

                    }

                    catch (error) {

                        console.error(
                            "Delete error:",
                            error
                        );

                        alert(
                            "PROJECT SYSTEM OFFLINE."
                        );

                    }

                }


                /* =====================================
                   RENAME PROJECT
                ===================================== */

                async function renameProject(
                    projectId,
                    currentName,
                    currentDescription
                ) {

                    const newName =
                        prompt(
                            "ENTER NEW PROJECT NAME:",
                            currentName
                        );

                    if (
                        !newName ||
                        !newName.trim()
                    ) {

                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                `/api/projects/${projectId}`,
                                {
                                    method: 'PUT',

                                    credentials:
                                        'include',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify({

                                            name:
                                                newName.trim(),

                                            description:
                                                currentDescription || ""

                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            alert(
                                "RENAME FAILED: " +
                                (
                                    data.message ||
                                    "Unknown error."
                                )
                            );

                            return;

                        }


                        await loadProjects();

                    }

                    catch (error) {

                        console.error(
                            "Rename error:",
                            error
                        );

                        alert(
                            "PROJECT SYSTEM OFFLINE."
                        );

                    }

                }


                /* =====================================
                   RENDER PROJECTS
                ===================================== */

                function renderProjects() {

                    projectsGrid.innerHTML =
                        '';


                    projectCount.innerText =
                        `${projects.length} PROJECT${projects.length === 1 ? '' : 'S'} AVAILABLE`;


                    if (
                        projects.length === 0
                    ) {

                        projectsGrid.innerHTML = `

                            <div
                                class="empty-projects"
                                style="grid-column:1/-1;">

                                <div
                                    class="empty-projects-icon">

                                    ◇

                                </div>

                                <h3>

                                    NO PROJECTS DETECTED

                                </h3>

                                <p>

                                    Initialize your first
                                    construction project.

                                </p>

                                <button
                                    class="create-project-btn"
                                    id="create-first-project">

                                    + CREATE FIRST PROJECT

                                </button>

                            </div>

                        `;


                        document
                            .getElementById(
                                'create-first-project'
                            )
                            .addEventListener(
                                'click',
                                createProject
                            );


                        return;

                    }


                    projects.forEach(
                        project => {

                            const card =
                                document.createElement(
                                    'div'
                                );


                            card.className =
                                'project-card';


                            card.innerHTML = `

                                <div
                                    class="project-icon">

                                    ◈

                                </div>

                                <div
                                    class="project-name">

                                    ${escapeHtml(
                                        project.name
                                    )}

                                </div>

                                <div
                                    class="project-description">

                                    ${escapeHtml(
                                        project.description ||
                                        'Aether Forge Constructor Project'
                                    )}

                                </div>

                                <div
                                    class="project-date">

                                    LAST UPDATED:
                                    ${formatDate(
                                        project.updated_at
                                    )}

                                </div>

                                <div
                                    class="project-actions">

                                    <button
                                        class="project-btn open-project"
                                        data-action="open">

                                        OPEN

                                    </button>

                                    <button
                                        class="project-btn rename-project"
                                        data-action="rename">

                                        RENAME

                                    </button>

                                    <button
                                        class="project-btn delete-project"
                                        data-action="delete">

                                        DELETE

                                    </button>

                                </div>

                            `;


                            /* OPEN */

                            card
                                .querySelector(
                                    '[data-action="open"]'
                                )
                                .addEventListener(
                                    'click',
                                    () => {

                                        openProject(
                                            project.id
                                        );

                                    }
                                );


                            /* RENAME */

                            card
                                .querySelector(
                                    '[data-action="rename"]'
                                )
                                .addEventListener(
                                    'click',
                                    () => {

                                        renameProject(
                                            project.id,
                                            project.name,
                                            project.description
                                        );

                                    }
                                );


                            /* DELETE */

                            card
                                .querySelector(
                                    '[data-action="delete"]'
                                )
                                .addEventListener(
                                    'click',
                                    () => {

                                        deleteProject(
                                            project.id,
                                            project.name
                                        );

                                    }
                                );


                            projectsGrid.appendChild(
                                card
                            );

                        }
                    );

                }


                /* =====================================
                   LOAD PROJECTS
                ===================================== */

                async function loadProjects() {

                    try {

                        projectCount.innerText =
                            "LOADING PROJECTS...";


                        const response =
                            await fetch(
                                '/api/projects',
                                {
                                    method: 'GET',

                                    credentials:
                                        'include'
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            console.error(
                                "Project loading failed:",
                                data
                            );

                            projectCount.innerText =
                                "PROJECT SYSTEM OFFLINE";

                            projectsGrid.innerHTML = `

                                <div
                                    class="empty-projects"
                                    style="grid-column:1/-1;">

                                    <div
                                        class="empty-projects-icon">

                                        ⚠

                                    </div>

                                    <h3>

                                        PROJECT SYSTEM OFFLINE

                                    </h3>

                                    <p>

                                        Unable to retrieve
                                        your project database.

                                    </p>

                                </div>

                            `;

                            return;

                        }


                        projects =
                            data.projects || [];


                        renderProjects();

                    }

                    catch (error) {

                        console.error(
                            "Project loading error:",
                            error
                        );


                        projectCount.innerText =
                            "PROJECT SYSTEM OFFLINE";


                        projectsGrid.innerHTML = `

                            <div
                                class="empty-projects"
                                style="grid-column:1/-1;">

                                <div
                                    class="empty-projects-icon">

                                    ⚠

                                </div>

                                <h3>

                                    PROJECT SYSTEM OFFLINE

                                </h3>

                                <p>

                                    Unable to connect
                                    to the project service.

                                </p>

                            </div>

                        `;

                    }

                }


                /* =====================================
                   CHECK AUTHENTICATION
                ===================================== */

                try {

                    const response =
                        await fetch(
                            '/api/auth/me',
                            {
                                method: 'GET',

                                credentials:
                                    'include'
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.authenticated
                    ) {

                        /*
                         * Projects require login.
                         */

                        authSection.innerHTML = `

                            <a
                                href="login.html"
                                class="btn-nav-login">

                                LOGIN

                            </a>

                            <a
                                href="signup.html"
                                class="btn-nav-register">

                                REGISTER

                            </a>

                        `;


                        projectsGrid.innerHTML = `

                            <div
                                class="empty-projects"
                                style="grid-column:1/-1;">

                                <div
                                    class="empty-projects-icon">

                                    ◇

                                </div>

                                <h3>

                                    AUTHENTICATION REQUIRED

                                </h3>

                                <p>

                                    Login to access your
                                    Aether Forge projects.

                                </p>

                                <a
                                    href="login.html"
                                    class="create-project-btn"
                                    style="
                                        display:inline-block;
                                        text-decoration:none;
                                    ">

                                    SYSTEM LOGIN

                                </a>

                            </div>

                        `;


                        projectCount.innerText =
                            "AUTHENTICATION REQUIRED";


                        return;

                    }


                    /* =================================
                       LOGGED IN
                    ================================= */

                    const username =
                        data.user.username;


                    authSection.innerHTML = `

                        <div
                            class="operative-badge">

                            OP:
                            ${escapeHtml(username)}

                        </div>

                        <button
                            class="btn-nav-logout"
                            id="logout-btn">

                            LOGOUT

                        </button>

                    `;


                    /* =================================
                       LOGOUT
                    ================================= */

                    document
                        .getElementById(
                            'logout-btn'
                        )
                        .addEventListener(
                            'click',
                            async () => {

                                try {

                                    await fetch(
                                        '/api/auth/logout',
                                        {
                                            method:
                                                'POST',

                                            credentials:
                                                'include'
                                        }
                                    );

                                }

                                catch (error) {

                                    console.error(
                                        "Logout error:",
                                        error
                                    );

                                }


                                window.location.href =
                                    'index.html';

                            }
                        );


                    /* =================================
                       CREATE BUTTON
                    ================================= */

                    createProjectBtn
                        .addEventListener(
                            'click',
                            createProject
                        );


                    /* =================================
                       LOAD PROJECTS
                    ================================= */

                    await loadProjects();

                }

                catch (error) {

                    console.error(
                        "Authentication check failed:",
                        error
                    );


                    authSection.innerHTML = `

                        <a
                            href="login.html"
                            class="btn-nav-login">

                            LOGIN

                        </a>

                        <a
                            href="signup.html"
                            class="btn-nav-register">

                            REGISTER

                        </a>

                    `;

                    projectCount.innerText =
                        "AUTHENTICATION ERROR";

                }

            }

        );

    </script>

</body>

</html>

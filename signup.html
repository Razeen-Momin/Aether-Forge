<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER FORGE | Sign up</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <script src="theme.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      .auth-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
      }
      .auth-top .logo-img {
        height: 56px;
        width: auto;
        display: block;
      }
      .auth-main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px 48px;
      }
      .auth-container {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow:
          0 1px 2px var(--shadow),
          0 16px 40px var(--shadow);
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .input-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        outline: none;
        font-size: 1rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
      }
      .btn-auth {
        width: 100%;
        padding: 13px;
        margin-top: 4px;
        background: var(--accent);
        border: 1px solid var(--accent);
        color: var(--on-accent);
        font-size: 1rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition:
          filter 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn-auth:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.25);
      }
      .toggle-text {
        margin-top: 22px;
        font-size: 0.9rem;
        color: var(--muted);
        display: block;
        text-decoration: none;
        text-align: center;
        transition: color 0.2s;
      }
      .toggle-text:hover {
        color: var(--accent);
      }
      #status-message {
        margin-top: 16px;
        font-size: 0.9rem;
        text-align: center;
        min-height: 20px;
      }
      #status-message.info {
        color: var(--muted);
      }
      #status-message.ok {
        color: var(--accent);
      }
      #status-message.err {
        color: var(--danger);
      }
      .google-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0 18px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .google-divider::before,
      .google-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .google-button-wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="auth-top">
      <a href="index.html" class="logo-block">
        <img src="logo.svg" alt="" class="logo-mark" /><span class="logo-text">Aether <b>Forge</b></span>
      </a>
      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
      >
        ☀️
      </button>
    </header>
    <main class="auth-main">
      <div class="auth-container">
        <h2>Create your account</h2>
        <p class="subtitle">Start building with Aether Forge.</p>
        <form id="register-form">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username" />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              autocomplete="new-password"
            />
          </div>
          <button type="submit" class="btn-auth">Create account</button>
        </form>
        <div id="status-message" class="info"></div>
        <a href="login.html" class="toggle-text"
          >Already have an account? Sign in.</a
        >
      </div>
    </main>

    <script>
      const registerForm = document.getElementById("register-form");
      const statusMessage = document.getElementById("status-message");

      function setStatus(kind, text) {
        statusMessage.className = kind;
        statusMessage.innerText = text;
      }

      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        setStatus("info", "Creating your account...");

        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();
          if (response.ok) {
            setStatus("ok", "Account created. Redirecting to sign in...");
            setTimeout(() => (window.location.href = "login.html"), 1500);
          } else {
            setStatus("err", data.message || "Registration failed.");
          }
        } catch (error) {
          setStatus("err", "Network error: server unreachable.");
        }
      });
    </script>
  </body>
</html>

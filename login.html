<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER FORGE | Sign in</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <script src="theme.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      .auth-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
      }
      .auth-top .logo-img {
        height: 56px;
        width: auto;
        display: block;
      }
      .auth-main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px 48px;
      }
      .auth-container {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow:
          0 1px 2px var(--shadow),
          0 16px 40px var(--shadow);
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .input-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        outline: none;
        font-size: 1rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
      }
      .btn-auth {
        width: 100%;
        padding: 13px;
        margin-top: 4px;
        background: var(--accent);
        border: 1px solid var(--accent);
        color: var(--on-accent);
        font-size: 1rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition:
          filter 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn-auth:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.25);
      }
      .toggle-text {
        margin-top: 22px;
        font-size: 0.9rem;
        color: var(--muted);
        display: block;
        text-decoration: none;
        text-align: center;
        transition: color 0.2s;
      }
      .toggle-text:hover {
        color: var(--accent);
      }
      #status-message {
        margin-top: 16px;
        font-size: 0.9rem;
        text-align: center;
        min-height: 20px;
      }
      #status-message.info {
        color: var(--muted);
      }
      #status-message.ok {
        color: var(--accent);
      }
      #status-message.err {
        color: var(--danger);
      }
      .google-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0 18px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .google-divider::before,
      .google-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .google-button-wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .forgot-row {
        text-align: right;
        margin: -6px 0 14px;
      }
      .forgot-link {
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: none;
      }
      .forgot-link:hover {
        color: var(--accent);
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <header class="auth-top">
      <a href="index.html" class="logo-block">
        <img src="logo.svg" alt="" class="logo-mark" /><span class="logo-text">Aether <b>Forge</b></span>
      </a>
      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
      >
        ☀️
      </button>
    </header>
    <main class="auth-main">
      <div class="auth-container">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue to Aether Forge.</p>
        <form id="login-form">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username" />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
            />
          </div>
          <div class="forgot-row">
            <a href="forgot-password.html" class="forgot-link"
              >Forgot password?</a
            >
          </div>
          <button type="submit" class="btn-auth">Sign in</button>
        </form>

        <div class="google-divider">or</div>

        <div
          id="g_id_onload"
          data-client_id="4289670365-pnst1jj7smrabb5stc1emb4kfvfe57q7.apps.googleusercontent.com"
          data-callback="handleGoogleCredential"
          data-auto_prompt="false"
        ></div>
        <div class="google-button-wrapper">
          <div
            class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="continue_with"
            data-shape="rectangular"
            data-logo_alignment="left"
          ></div>
        </div>

        <div id="status-message" class="info"></div>

        <a href="signup.html" class="toggle-text"
          >New here? Create an account.</a
        >
      </div>
    </main>

    <script>
      const loginForm = document.getElementById("login-form");
      const statusMessage = document.getElementById("status-message");

      function setStatus(kind, text) {
        statusMessage.className = kind;
        statusMessage.innerText = text;
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        setStatus("info", "Signing in...");

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();
          if (response.ok) {
            setStatus("ok", "Signed in. Redirecting...");
            localStorage.setItem("stark_operative", username);
            setTimeout(() => (window.location.href = "index.html"), 1000);
          } else {
            setStatus("err", data.message || "Sign in failed.");
          }
        } catch (error) {
          setStatus("err", "Network error: server unreachable.");
        }
      });

      async function handleGoogleCredential(response) {
        setStatus("info", "Verifying Google account...");

        try {
          const result = await fetch("/api/auth/google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ credential: response.credential }),
          });
          const data = await result.json();

          if (result.ok) {
            setStatus("ok", "Signed in. Redirecting...");
            localStorage.setItem("stark_operative", data.user.username);
            setTimeout(() => {
              window.location.href = "index.html";
            }, 1000);
          } else {
            setStatus("err", data.message || "Google sign in failed.");
          }
        } catch (error) {
          console.error("Google Login error:", error);
          setStatus("err", "Network error: server unreachable.");
        }
      }
    </script>
  </body>
</html>
